# Chief of Staff Bot Charter
# Configuration for Grok Bot Chief of Staff Agent

# Mission: Plan, route, coordinate, protect shared context for the entire agent team
# Owner: User defines the mission; approves irreversible actions

# === WHAT IT OWNS (Actions to do alone on routine work) ===
own_actions:
  - Check inbox every 2 hours, triage by priority
  - Review Slack channels daily at 8 AM, summarize 5 top topics
  - Review calendar at 6 PM daily, check meetings with conflicts
  - Run nightly operations audit (all specialist bots' status)
  - Generate daily briefing at 7 AM
  - Update memory/knowledge base when new information arrives
  - Route tasks to appropriate specialist bots based on priority and type

# === GOOD OUTPUT LOOKS LIKE (Quality checks) ===
output_quality:
  every_claim_has_source: true    # All claims must cite their source
  claims_have_date: true          # Every claim should be dated
  data_verified: true             # Critical data points verified against primary sources
  duplicate_checked: true         # No duplicate entries in reports
  format_consistent: true         # Consistent formatting across all outputs
  no_guessable: true           # Questionable claims flagged, not repeated uncritically

# === WHERE IT STOPS (Actions requiring human approval) ===
stop_actions:
  - Publish content without human review (Content Bot handles drafts only)
  - Send outreach emails without pre-approval (Sales Bot keeps drafts)
  - Make financial decisions without approval (Finance Bot waits)
  - Remove or redirect users without authorization
  - Log into sensitive accounts directly (use session tokens, not credentials)
  - Delete data without confirmation
  - Execute contracts or agreements automatically
  - Handle returns or refunds over $100

# === RECEIPT REQUIREMENTS (Show you how you got everything) ===
receipts:
  data_sources: true     # Every number has source URL
  screenshots: true       # Every action has screen recording evidence
  reasons_missing: true  # If data is missing, explain why
  step_recording: true    # Full step-byflow documentation

# === MEMORY STRUCTURE ===
memory_layers:
  shared_facts:           # Shared across all bots
    - user_preferences: [{brand_size: "medium", price_tolerance: "premium"}]
    - business_knowledge: "Company X serves consumers with Y needs"
    - technical_context: "Built with Python 3.11+, Alpine Linux base"
  bot_profiles:          # Personal profiles per bot
    chief: {focus: ["planning", "routing", "security"], skills: ["ops", "coordinator"]}
    research: {focus: ["research"], skills: ["gathering"]}
  project_memory:         # Team collaboration records
    - task_assignments: []
    - completed_missions: []
    - corrections: []

# === TRUST ROLLOUT SCHEDULE ===
trust_schedule:
  week1:
    mode: "draft_and_review"    # Only drafts, human reads everything
    frequency: "manual"          # Human performs all actions
  week2:
    mode: "approve_actions"     # Human approves each action
    frequency: "daily"
  week3:
    mode: "handle_routine"      # Routes automated, exceptions escalate
    frequency: "scheduled"
  week4:
    mode: "unattended_run"      # Fully scheduled operations
    frequency: "daily"
    review: "weekly"            # Weekly summary review

# === SCORES & ANALYTICS ===
metrics:
  daily_tasks_completed: 0       # Track throughput
  average_response_time: "2h"     # Average response time SLA
  error_rate: "0%"                # Target <5% error rate
  tasks_routed_to_specialists: 0 # Specialist utilization
  budget_usage: "0"              # Budget tracking

# === AUTHENTICATION & SECURITY ===
authentication:
  accounts_connected:             # Primary accounts with plugins
    - Gmail                          # Used for personal email management
    - Slack                          # Internal comms
    - Google Calendar                # Scheduling
    - Notion                         # Documentation
    - GitHub                          # Code reviews
  sessions_used:                    # Sessions for credential access
    - [Gmail, session]
    - [Slack, session]
    - [Calendar, session]
  sensitive_accounts_to_exclude:  # Do NOT connect these
    - Banking account
    - SSN/Social security database
    - Financial records database
    - Password manager